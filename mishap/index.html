<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
<title>Mishap</title>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand">
      <div class="logo">M</div>
      <div><h1>Mishap <span class="shield">✓</span></h1><p>Local-first. Your data stays on your device.</p></div>
    </div>
    <button class="more" id="moreBtn">⋮</button>
  </header>
  <main>
    <section class="stats" id="stats"></section>
    <section class="log-card">
      <button class="log-title" id="toggleForm"><span class="plus">+</span><strong>Log a Mishap</strong><span class="chevron" id="formChevron">⌃</span></button>
      <form id="mishapForm">
        <div class="field-grid">
          <label class="field"><span>Date & time</span><input id="date" type="datetime-local" required></label>
          <label class="field"><span>Severity</span><select id="severity"><option>Minor</option><option selected>Moderate</option><option>Major</option></select></label>
          <label class="field"><span>What did you eat/drink?</span><input id="food" placeholder="e.g. Biryani + 3 drinks" required></label>
          <label class="field"><span>Quantity</span><input id="quantity" placeholder="e.g. 1.5 plates, 3 drinks"></label>
          <label class="field"><span>Type</span><select id="type"><option>Overeating</option><option>Alcohol</option><option>Junk food</option><option>Late-night eating</option><option>Snacking</option><option>Sugary drink</option><option>Skipped planned meal</option><option>Other</option></select></label>
          <label class="field"><span>Trigger</span><select id="trigger"><option>Hunger</option><option>Social event</option><option>Alcohol</option><option>Craving</option><option>Poor planning</option><option>Stress</option><option>Poor sleep</option><option>Food availability</option><option>Boredom</option><option>Other</option></select></label>
          <label class="field"><span>Hunger before</span><select id="hunger"><option>1 — Not hungry</option><option>2</option><option>3</option><option>4 — Hungry</option><option>5 — Extremely hungry</option></select></label>
          <label class="field"><span>Context</span><input id="context" placeholder="Office, home, wedding..."></label>
        </div>
        <label class="long-field"><span>Why did it happen?</span><textarea id="why" maxlength="300" placeholder="No judgement. What actually led to it?"></textarea></label>
        <label class="long-field"><span>What was the impact?</span><textarea id="impact" maxlength="300" placeholder="Bloating, poor sleep, missed target..."></textarea></label>
        <label class="long-field"><span>What will I do differently next time?</span><textarea id="next" maxlength="300" placeholder="One concrete change."></textarea></label>
        <button class="save" type="submit">✓ &nbsp; Save Incident</button>
      </form>
    </section>
    <section class="recent-head"><h2>Recent Mishaps</h2><button id="viewAll">View all</button></section>
    <section id="incidentList" class="incidents"></section>
    <section id="empty" class="empty hidden"><div>◎</div><strong>No mishaps yet</strong><p>Log the next one. The goal is learning, not perfection.</p></section>
    <section class="retro hidden" id="retro"><div class="retro-head"><h2>Weekly Retrospective</h2><button id="closeRetro">×</button></div><div id="retroContent"></div></section>
  </main>
  <button class="fab" id="fab">+</button>
  <nav class="nav">
    <button class="active" data-tab="home">⌂<span>Home</span></button>
    <button data-tab="history">☷<span>History</span></button>
    <button data-tab="insights">▥<span>Insights</span></button>
    <button data-tab="backup">☁<span>Backup</span></button>
    <button data-tab="settings">⚙<span>Settings</span></button>
  </nav>
</div>
<script src="app.js"></script>
</body>
</html>
